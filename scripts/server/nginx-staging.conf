# 3D-Shop staging (K55). setup.sh bunu /etc/nginx/sites-available/dtd-staging olarak kurar; HTTPS bloğunu
# certbot (--nginx) ekler. Finans ve Cortex site tanımlarına dokunulmaz.
#
#   /            → Next.js (dtd-web, 127.0.0.1:3101)
#   /api/        → API (dtd-api, 127.0.0.1:3100)
#   /yonetim/    → yönetim paneli statik dosyaları (/srv/dtd/admin)
# Tüm site parola korumalıdır (basic auth) ve arama motorlarına kapalıdır.

server {
    server_name staging.firmaxi.com;

    # Cloudflare arkasında gerçek ziyaretçi IP'si (hız sınırı ve denetim kaydı için)
    include /etc/nginx/snippets/dtd-cloudflare-realip.conf;

    auth_basic "3D-Shop staging";
    auth_basic_user_file /etc/nginx/dtd-staging.htpasswd;

    client_max_body_size 12m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Sağlık uçları parolasız (harici uptime izleme, K59)
    location = /api/healthz {
        auth_basic off;
        proxy_pass http://127.0.0.1:3100;
    }

    # Kaynak e-ticaret webhook'ları parolasız: sunucudan sunucuya gelir, kendi HMAC imzasıyla korunur (F1.4)
    location /api/webhooks/ {
        auth_basic off;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /yonetim {
        return 301 /yonetim/;
    }

    location /yonetim/assets/ {
        alias /srv/dtd/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Yönetim paneli (F6.1): nginx'te konumdaki add_header sunucu düzeyindekileri devralmaz, hepsi burada.
    # CSP: satır içi betik yok (Vite derlemesi); 3D editör Meshopt WebAssembly kullanır; ürün görselleri https.
    location /yonetim/ {
        alias /srv/dtd/admin/;
        try_files $uri $uri/ /yonetim/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options DENY always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
    listen [::]:80;
}
